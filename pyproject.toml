[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conference_agent"
version = "0.1.0"
description = "AI agent that compiles academic/professional conferences into a table and exports them as a calendar feed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joseph Rich" }]
# The base install covers querying the database and adding / deleting entries.
# Discovery (`conference-agent discover`) needs the `discover` extra.
dependencies = [
    "pydantic>=2.0",
    "SQLAlchemy>=2.0",
    "tabulate>=0.9"
]

[project.optional-dependencies]
# anthropic is used only by the `api` backend; the default `claude-code` backend
# drives the local `claude` CLI. requests + beautifulsoup4 serve the page watch.
discover = ["anthropic>=0.40", "requests>=2.31", "beautifulsoup4>=4.12"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "mangum>=0.17", "pg8000>=1.30"]
dev = ["pytest>=7.0", "ruff>=0.4", "bandit>=1.7", "psycopg[binary]>=3.1", "conference_agent[web,discover]"]

[project.scripts]
conference-agent = "conference_agent.cli:main"
conf-build-table = "scripts.build_table:main"
conf-daily-update = "scripts.daily_update:main"

[tool.setuptools]
packages = ["conference_agent", "web"]

# Ship the static SPA assets with the `web` package so they are present in the
# Lambda artifact (FileResponse / StaticFiles resolve them relative to the package).
[tool.setuptools.package-data]
web = ["static/*"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access (excluded from CI by default)",
    "llm: tests that call the Anthropic API (excluded from CI by default)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
